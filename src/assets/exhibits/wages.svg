<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="Illustrative sheet: Wages ordered">
  <rect width="600" height="800" fill="#f7f5ef"/>
  <rect x="30" y="30" width="540" height="740" fill="#ffffff" stroke="#d6d1c4" stroke-width="2"/>
  <text x="300" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#333">IN THE COUNTY COURT</text>
  <text x="300" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#111">Wages ordered</text>
  <text x="300" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#555">Order to pay</text>
  <g fill="#e4e0d6">
    <rect x="80" y="240" width="440" height="12"/><rect x="80" y="270" width="400" height="12"/>
    <rect x="80" y="300" width="430" height="12"/><rect x="80" y="330" width="360" height="12"/>
    <rect x="80" y="390" width="440" height="12"/><rect x="80" y="420" width="410" height="12"/>
    <rect x="80" y="450" width="300" height="12"/>
  </g>
  <rect x="80" y="520" width="200" height="22" fill="#111"/>
  <rect x="320" y="520" width="200" height="22" fill="#111"/>
  <text x="300" y="720" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#999">Illustrative example — not a real case</text>
</svg>
